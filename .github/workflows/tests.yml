name: Lab 02 - BJT DC Bias Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-web:
    name: Python 3.12 - Model and Flask
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out submission
        uses: actions/checkout@v7

      - name: Configure Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run engineering and HTTP tests
        run: python -m unittest discover -s tests -v
